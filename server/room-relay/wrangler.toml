name = "notchapple-rooms"
main = "src/relay.js"
compatibility_date = "2026-09-01"

# One Durable Object per room topic. It only forwards live frames between the
# people connected right now; nothing is stored (no storage API is used).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Friends (private chat): one mailbox per friend code (stores sealed messages for up to 14 days, never readable by the
# server) and a small rate-limit counter. Both are on the free plan (SQLite-backed Durable Objects).
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "FRIEND_RATE"
class_name = "FriendRate"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Mailbox", "FriendRate"]

# Friends leaderboards (docs/LEADERBOARDS.md): one object per board code hash. It keeps each game's best scores for 90 days
# (a display name, a score, a day, a hashed random device id; no addresses, no accounts). Free plan (SQLite-backed).
# Rate limiting reuses the FRIEND_RATE counter above, so there is nothing else to create.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Board"]
