name = "notchapple-licenses"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Filled in by scripts/setup.sh (npx wrangler kv namespace create LICENSES).
[[kv_namespaces]]
binding = "KV"
id = "8632410ec3864461b124c4522607275d"

# Notch Apple AI's daily allowance per key (one Durable Object per key; no KV writes).
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

# The Plane game's world leaderboard (a board per mode) and its posting limit (per address).
[[durable_objects.bindings]]
name = "PLANE_BOARD"
class_name = "PlaneBoard"

[[durable_objects.bindings]]
name = "PLANE_RATE"
class_name = "PlaneRate"

[[durable_objects.bindings]]
name = "PLANE_SKY"
class_name = "PlaneSky"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlaneBoard", "PlaneRate"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PlaneSky"]

[triggers]
crons = ["23 */6 * * *"]     # the checkout reminder emails (sendReminders), four times a day

[vars]
WALLET = "ltc1qymlmvkdmvpk5f90esthzgwaw6w0tuzq6tdr6kf"
# Other coins people can pay in (public receiving addresses; the server only ever reads the blockchain, it holds no keys).
WALLET_BTC = "bc1q6n68e5pkteuvs9fj38an340yj9vz5h84gu0gz5"
WALLET_ETH = "0x7CB03e86d62939C6BB743529Ba19E665a31dbCc5"
WALLET_SOL = "8Ri5sCbpdPRVz8rmrirJWH6hv7ZAKLcdb7AgJFfekpFC"
NETWORK = "mainnet"
PRICE_PRO = "1"
PRICE_ULTIMATE = "5"
PRICE_UPGRADE = "4"
DEVICE_LIMIT = "3"
# Card payments through Ziina: UAE customers pay in AED (the customer pays the card fee, 3% + AED 1). They switch on when the
# ZIINA_API_KEY secret is set (`npx wrangler secret put ZIINA_API_KEY`). ZIINA_TEST = "1" makes every payment a Ziina test payment
# (any card works, no money moves) and lets a test request pick the UAE or international price; keep it "0" in production.
PRICE_AED_PRO = "4"
PRICE_AED_ULTIMATE = "10"
PRICE_AED_UPGRADE = "6"
ZIINA_TEST = "0"
# International customers pay by card in USD (the USD prices above) with a higher card fee, paid by the customer.
CARD_FEE_INTL_PCT = "5"
CARD_FEE_INTL_FLAT = "0.30"
# "1" = a device new to a key must confirm the key's email with a 6-digit code (or an authenticator app) once. Deploy this version first,
# ship the app update, then set "1": older apps cannot ask for the code. Devices already registered are never asked.
BIND_REQUIRE = "1"
# Ultimate is on sale (approved 4 October 2026); set to "0" to stop selling it.
ULTIMATE_ON = "1"
# "brevo" (works with a verified Gmail sender, 300 emails/day free) or "resend" (needs your own domain).
MAIL_PROVIDER = "brevo"
# Notch Apple AI (Pro and Ultimate): leave off until the AI_API_KEY secret is set. AI_BASE is any OpenAI-compatible endpoint.
AI_MODEL = "gemini-3.5-flash-lite"
AI_LIMIT_PRO = "60"
AI_LIMIT_ULTIMATE = "200"

# Secrets (never in this file): AI_API_KEY (Notch Apple AI), SIGNING_KEY, ADMIN_TOKEN, EMAIL_PEPPER, MAIL_API_KEY, and MAIL_FROM
# (the sender address verified in Brevo; a secret so it isn't published in this repo).
# Set them with scripts/setup.sh or `npx wrangler secret put NAME`.

# Testnet copy for the sandbox test: `npx wrangler deploy --env testnet`
[env.testnet]
name = "notchapple-licenses-testnet"
kv_namespaces = [{ binding = "KV", id = "REPLACE_WITH_TESTNET_KV_ID" }]
[env.testnet.vars]
WALLET = "REPLACE_WITH_TESTNET_ADDRESS"
NETWORK = "testnet"
PRICE_PRO = "1"
PRICE_ULTIMATE = "5"
PRICE_UPGRADE = "4"
DEVICE_LIMIT = "3"
ULTIMATE_ON = "1"
MAIL_PROVIDER = "brevo"
MAIL_FROM = ""
# Testnet coins have no price: pretend 1 tLTC = $70.
TEST_LTC_PRICE = "70"
