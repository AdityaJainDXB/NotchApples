<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Notch Apple — your notch, finally useful</title><link rel="stylesheet" href="app.css"></head><body><div id="root"></div><script src="app.js"></script><script>/* mark the main call-to-action buttons so they get the indigo style */new MutationObserver(function(){document.querySelectorAll(".metal-fx-root[data-variant=button]:not([data-tagged])").forEach(function(b){b.setAttribute("data-tagged","1");if(/^(Download|Get |Pay |Buy)/.test(b.textContent.trim()))b.classList.add("btn-primary")})}).observe(document.body,{childList:true,subtree:true})</script></body></html>
