<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #stage { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 18px; box-sizing: border-box;
    opacity: 0; transition: opacity .6s ease; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 2px 14px rgba(0,0,0,.65); }
  #stage.on { opacity: 1; }
  body.right #stage { text-align: right; }
  .l { margin: 0; line-height: 1.2; overflow-wrap: anywhere; transition: opacity .45s ease, transform .45s ease, font-size .45s ease, color .45s ease; }
  .prev { font-size: 17px; font-weight: 600; opacity: .38; }
  .cur { font-size: 28px; font-weight: 800; opacity: 1; min-height: 34px; }
  .next { font-size: 17px; font-weight: 600; opacity: .5; }
  .next + .next { opacity: .32; }
  .l.swap { opacity: 0; transform: translateY(8px); }
</style>
</head>
<body>
<div id="stage">
  <p class="l prev" id="prev"></p>
  <p class="l cur" id="cur"></p>
  <p class="l next" id="n1"></p>
  <p class="l next" id="n2"></p>
</div>
<script>
  const stage = document.getElementById('stage');
  const nodes = { prev: document.getElementById('prev'), cur: document.getElementById('cur'), n1: document.getElementById('n1'), n2: document.getElementById('n2') };

  function setText(node, t) {
    if (node.textContent === t) return;
    node.classList.add('swap');
    clearTimeout(node._t);
    node._t = setTimeout(() => { node.textContent = t; node.classList.remove('swap'); }, node.textContent ? 180 : 0);
  }
  function apply(p) {
    if (!p) return;
    document.body.classList.toggle('right', p.side === 'right');
    setText(nodes.prev, p.prev || '');
    setText(nodes.cur, p.current || '');
    setText(nodes.n1, (p.next && p.next[0]) || '');
    setText(nodes.n2, (p.next && p.next[1]) || '');
    stage.classList.toggle('on', !!p.playing);
  }
  window.__apply = apply;

  const T = window.__TAURI__;
  if (T && T.event) {
    T.event.listen('lyrics-overlay', (e) => apply(e.payload));
    T.event.emit('lyrics-overlay-ready', null);
  } else {
    // Opened in a plain browser (design check): accept a posted payload.
    window.addEventListener('message', (e) => apply(e.data));
  }
</script>
</body>
</html>
