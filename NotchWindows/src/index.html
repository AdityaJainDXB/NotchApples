<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline';
               connect-src 'self' ipc: http://ipc.localhost https: wss:; media-src 'self' blob: data: mediastream:;
               script-src 'self'; object-src 'none'; base-uri 'none'">
<title>Notch apple</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="collapsed">
  <div id="shell">
    <div id="pill" title="Open Notch apple (Ctrl+Alt+N)">
      <div class="ear left" id="ear-left"></div>
      <div class="hint" id="pill-hint">Notch apple</div>
      <div class="ear right" id="ear-right"></div>
    </div>

    <div id="panel">
      <div id="topbar">
        <nav id="tabbar" aria-label="Tabs"></nav>
        <div id="tools"></div>
      </div>
      <main id="page"></main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
