[package]
name = "pairdrop-core"
version = "0.1.0"
edition = "2021"
description = "Notch apple PairDrop: serverless file sharing and private chat on the local network, compatible with the Mac app"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
rand = "0.8"
