name: NotchApple
options:
  bundleIdPrefix: com.notchapple
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NotchKit:
    path: Packages/NotchKit
  FoldCore:
    path: Packages/FoldCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.50"
    CURRENT_PROJECT_VERSION: "234"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  NotchApple:
    type: application
    platform: macOS
    sources:
      - NotchApple
      - Shared
      - CompanionKit
      - path: LICENSES
        buildPhase: resources
      # Friends leaderboards (optional, off by default) are used by Plane, Racing, Tetris and Daily Word; shared with the Windows app.
      - path: NotchWindows/src/js/games/leaderboard.js
        buildPhase: resources
      # The mascot greeting (a character moves across the notch when the Mac wakes) is shared with the Windows app.
      - path: NotchWindows/src/js/mascots.js
        buildPhase: resources
      # The Plane game's engine is shared with the Windows app.
      - path: NotchWindows/src/js/games/plane-sim.js
        buildPhase: resources
      # The Racing game's engine is shared with the Windows app too.
      - path: NotchWindows/src/js/games/racing.js
        buildPhase: resources
      # Capture the Flag (ctf.js and its rules) is shared with the Windows app too.
      - path: NotchWindows/src/js/games/ctf-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/ctf.js
        buildPhase: resources
      # Rocket League (rocket.js and its physics) is shared with the Windows app too.
      - path: NotchWindows/src/js/games/rocket-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/rocket.js
        buildPhase: resources
      # Scribble (scribble.js and its rules) is shared with the Windows app too.
      - path: NotchWindows/src/js/games/scribble-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/scribble.js
        buildPhase: resources
      # Chess (chess.js and its rules) is shared with the Windows app too.
      - path: NotchWindows/src/js/games/chess-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/chess.js
        buildPhase: resources
      # Tetris, Daily Word and Daily Trivia are shared with the Windows app too.
      - path: NotchWindows/src/js/games/tetris-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/tetris.js
        buildPhase: resources
      # Night Shift (an original night-guard horror game) is shared with the Windows app too.
      - path: NotchWindows/src/js/games/nightshift-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/nightshift.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/wordle-words.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/wordle-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/wordle.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/trivia-questions.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/trivia-logic.js
        buildPhase: resources
      - path: NotchWindows/src/js/games/trivia.js
        buildPhase: resources
      # Klick's keyboard sounds, shared with the Windows app (scripts/klick_sounds.py makes them).
      - path: NotchWindows/src/sounds/klick
        type: folder
        buildPhase: resources
    dependencies:
      - target: NotchWidget
        embed: true
      - package: NotchKit
      - package: FoldCore
    settings:
      base:
        PRODUCT_NAME: "Notch Apple"
        PRODUCT_BUNDLE_IDENTIFIER: com.notchapple.app
        INFOPLIST_FILE: NotchApple/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchApple/Resources/NotchApple.entitlements
        GENERATE_INFOPLIST_FILE: NO
  NotchWidget:
    type: app-extension
    platform: macOS
    sources: [NotchWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchapple.app.widget
        INFOPLIST_FILE: NotchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchWidget/NotchWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NotchCompanion:
    type: application
    platform: iOS
    sources: [NotchCompanion, CompanionKit]
    settings:
      base:
        PRODUCT_NAME: "NotchCompanion"
        PRODUCT_BUNDLE_IDENTIFIER: com.notchapple.companion
        INFOPLIST_FILE: NotchCompanion/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NotchAppleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NotchAppleTests
      - NotchApple/Modules/Claude/MathText.swift
      - NotchApple/Modules/Claude/AIModes.swift
      - NotchApple/Modules/Claude/AIProviders.swift
      - NotchApple/Modules/Claude/AIStreaming.swift
      - NotchApple/Modules/Claude/ClaudeClient.swift
      - NotchApple/Core/KeychainHelper.swift
      - NotchApple/Core/LicenseKey.swift
      - NotchApple/Modules/Claude/AIPure.swift
      - NotchApple/Modules/Claude/AppleIntelligence.swift
      - NotchApple/Modules/Tools/Converter.swift
      - NotchApple/Core/PureModels.swift
      - NotchApple/Core/HotCornerLogic.swift
      - NotchApple/Modules/Games/GameEngines.swift
      - NotchApple/Modules/Games/GamesMenuLogic.swift
      - NotchApple/Core/ClaudeCodeStatusLogic.swift
      - NotchApple/Modules/Claude/GeminiFallback.swift
      - NotchApple/Modules/Claude/GeminiFallbackLogic.swift
      - NotchApple/Modules/Tools/MathEngine.swift
      - NotchApple/Core/ModuleLayoutLogic.swift
      - NotchApple/Modules/Sharing/PairDropLogic.swift
      - NotchApple/Core/TourLogic.swift
      - NotchApple/Core/ClaudeLimitsLogic.swift
      - NotchApple/Core/TodoLogic.swift
      - NotchApple/Core/ReleaseNotesLogic.swift
      - NotchApple/Core/UpdateCadenceLogic.swift
      - NotchApple/Core/UpdateSigning.swift
      - NotchApple/Modules/Plugins/PluginPinning.swift
      - NotchApple/Modules/Radar/RadarLogic.swift
      - NotchApple/Core/EntitlementLogic.swift
      - NotchApple/Modules/Wallpaper/WallpaperLogic.swift
      - NotchApple/Modules/Games/CardsLogic.swift
      - NotchApple/Modules/BambuStatusChecker/BambuStatusLogic.swift
      - NotchApple/Modules/BambuStatusChecker/BambuCloudLogic.swift
      - NotchApple/Modules/BambuStatusChecker/BambuCameraLogic.swift
      - NotchApple/Core/UpdateFeedLogic.swift
      - NotchApple/Modules/Messenger/Friends/FriendsLogic.swift
      - NotchApple/Modules/Messenger/TicTacToeLogic.swift
      - NotchApple/Modules/Messenger/TwoPlayerGames.swift
      - NotchApple/Modules/Tennis/TennisLogic.swift
      - NotchApple/Core/ClaudeUsageLogic.swift
      - NotchApple/Core/SmartHomeLogic.swift
      - NotchApple/Core/ClipboardLinkLogic.swift
      - NotchApple/Core/DevToolkitLogic.swift
      - NotchApple/Core/WellbeingLogic.swift
      - NotchApple/Core/SystemWatchLogic.swift
      - NotchApple/Core/SecretLogic.swift
      - NotchApple/Core/QuickAnswerLogic.swift
      - NotchApple/Core/SnippetVariables.swift
      - NotchApple/Core/HabitLogic.swift
      - NotchApple/Core/ProjectFocusLogic.swift
      - NotchApple/Core/NamedTimerLogic.swift
      - NotchApple/Core/EmojiLogic.swift
      - NotchApple/Core/MeetingNotesLogic.swift
      - NotchApple/Core/LinkShelfLogic.swift
      - NotchApple/Core/MeetingSummaryLogic.swift
      - NotchApple/Core/EmojiData.swift
      - NotchApple/Core/VPNTunnel.swift
      - CompanionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchapple.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchAppleTests:
    build:
      targets:
        NotchAppleTests: all
    test:
      targets: [NotchAppleTests]

