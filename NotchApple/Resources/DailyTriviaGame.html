<!doctype html>
<!-- Daily Trivia in the Mac app's Games tab: DailyTriviaGameView loads this page in a web view. The game itself is trivia.js with its rules
     in trivia-logic.js and its questions in trivia-questions.js, the same files the Windows app uses (NotchWindows/src/js/games/,
     copied in as resources). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; } #game { position: absolute; inset: 0; }</style>
</head>
<body>
  <div id="game"></div>
  <script src="trivia-questions.js"></script>
  <script src="trivia-logic.js"></script>
  <script src="trivia.js"></script>
  <script>window.NotchTriviaGame.mount(document.getElementById('game'));</script>
</body>
</html>
