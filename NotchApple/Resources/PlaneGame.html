<!doctype html>
<!-- The Plane game in the Mac app's Games tab: PlaneGameView loads this page in a web view. The game itself is
     plane-sim.js, the same file the Windows app uses (NotchWindows/src/js/games/plane-sim.js, copied in as a resource). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; } #game { position: absolute; inset: 0; }</style>
</head>
<body>
  <div id="game"></div>
  <script src="plane-sim.js"></script>
  <script>window.NotchPlaneGame.mount(document.getElementById('game'));</script>
</body>
</html>
