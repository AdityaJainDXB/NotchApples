<!doctype html>
<!-- Eagle Ride in the Mac app's Games tab: EagleRideGameView loads this page in a web view. The game itself is eagle-ride.js with its
     rules in eagle-ride-logic.js, the same files the Windows app uses (NotchWindows/src/js/games/, copied in as resources). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1b2a; } #game { position: absolute; inset: 0; }</style>
</head>
<body>
  <div id="game"></div>
  <script src="eagle-ride-logic.js"></script>
  <script src="eagle-ride.js"></script>
  <script>window.NotchEagleGame.mount(document.getElementById('game'));</script>
</body>
</html>
