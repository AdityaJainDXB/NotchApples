name: Problem in the Mac app
description: Something is broken, crashes or looks wrong in Notch Apple for Mac
title: "[Mac] "
labels: ["bug", "mac"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please do not include licence keys, access codes or other personal data.
  - type: input
    id: version
    attributes:
      label: App version
      description: Notch Apple menu, then About (for example 2.0.53)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Pro 14-inch (notch)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - The notch itself (opening, hover, layout)
        - Music / Now Playing
        - Calendar / Reminders / Clipboard / other widgets
        - File shelf / sharing (PairDrop)
        - Printer Status (Bambu)
        - Games / flight simulator
        - Updates
        - Licence / Ultimate
        - Settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the notch
        2. ...
    validations:
      required: true
  - type: dropdown
    id: how-often
    attributes:
      label: How often does it happen?
      options: [Every time, Sometimes, Only once]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, screen recordings or crash report
      description: Drag files here. Crash reports are in Console, then Crash Reports.
