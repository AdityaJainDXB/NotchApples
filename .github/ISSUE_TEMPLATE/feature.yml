name: Suggest a feature
description: An idea that would make Notch Apple better
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Which app?
      options: [Mac, Windows, Both, Website]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: How do you do it today?
  - type: dropdown
    id: importance
    attributes:
      label: How much would this matter to you?
      options: [Nice to have, I would use it often, I need it]
