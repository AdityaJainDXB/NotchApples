name: Refresh website after a release

# Pages only deploys from main, and a `release` event runs from the release's tag, so a release cannot deploy the site
# itself. It asks main to: the deploy regenerates web/latest.json (what the apps' update checks read) from the new release.
on:
  release:
    types: [published, edited, released]

permissions:
  actions: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask main to deploy the website
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
