name: Refresh website after a release

# Pages deploys from main. After a release build finishes, redeploy so latest.json offers it. latest.json takes the newest
# Mac release and the newest Windows build separately, so neither platform's update waits for the other (Mac releases
# also redeploy from scripts/release.sh). Waiting for a matching pair used to hold the Mac update back whenever a newer
# version was released before the Windows build of the last one had finished.
on:
  workflow_run:
    workflows: ['Mac build', 'Windows build']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (startsWith(github.event.workflow_run.head_branch, 'mac-v') || startsWith(github.event.workflow_run.head_branch, 'win-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Ask main to deploy the website
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
