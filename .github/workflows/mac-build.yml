# Builds the Mac DMG on a GitHub macOS runner and publishes it as a release.
#
# The app is ad-hoc signed (no certificate needed), so this does the same thing as
# running scripts/build_dmg.sh on a Mac with Xcode. Push a tag like `mac-v1.14.6`
# (or run it by hand) after setting MARKETING_VERSION in project.yml. It creates the
# `v<version>` release, which the in-app updater and Homebrew read, then updates the
# Homebrew cask to match the DMG.

name: Mac build

on:
  workflow_dispatch:
  push:
    tags: ['mac-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    # Lets the release secrets (UPDATE_SIGNING_KEY, the premium deploy key) live in a protected Environment named
    # "release": limited to mac-v* tags, with a required reviewer. Harmless until that Environment is set up.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      # A release only goes out if the logic and the real PairDrop transfers pass first.
      - name: Logic tests
        run: ./scripts/run-app-tests.sh

      - name: PairDrop transfers over loopback
        run: ./scripts/run-pairdrop-loopback.sh

      # The Mac's PairDrop code and the Windows engine must understand each other, in both directions.
      - name: PairDrop interop (Mac and Windows engines)
        run: ./scripts/run-pairdrop-interop.sh

      # The Ultimate modules are in a private repository, fetched with a read-only deploy key. An official build fails
      # rather than ship without them.
      - name: Build the DMG
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
          PREMIUM_DEPLOY_KEY: ${{ secrets.PREMIUM_DEPLOY_KEY }}
          REQUIRE_PREMIUM: "1"
        run: ./scripts/build_dmg.sh

      - name: Launch check (the app must start and stay running)
        run: ./scripts/launch-check.sh

      - name: Read the version
        id: v
        run: echo "version=$(grep MARKETING_VERSION project.yml | head -1 | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"

      # Signs the DMG with the release key, so the in-app updater can check it really came from us before opening it.
      # See docs/UPDATE_SIGNING.md. Until the UPDATE_SIGNING_KEY secret exists the release goes out unsigned, which
      # this version of the app still accepts (UpdateSigning.requireSignature is false).
      - name: Sign the DMG for the updater
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set, so this release is published unsigned."
            exit 0
          fi
          swift scripts/sign-update.swift sign "dist/NotchApple-$VERSION.dmg" "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notch-apple-mac
          path: dist/NotchApple-${{ steps.v.outputs.version }}.dmg
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          # The Mac updater reads the latest release and installs its DMG.
          make_latest: true
          name: "Notch apple ${{ steps.v.outputs.version }}"
          body_path: release-notes/${{ steps.v.outputs.version }}.md
          files: |
            dist/NotchApple-${{ steps.v.outputs.version }}.dmg
            dist/NotchApple-${{ steps.v.outputs.version }}.dmg.sig

      - name: Point the Homebrew cask at this DMG
        run: |
          cp Casks/notch-apple.rb /tmp/notch-apple.rb
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/notch-apple.rb Casks/notch-apple.rb
          if ! git diff --quiet Casks/notch-apple.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/notch-apple.rb
            git commit -m "Cask: ${{ steps.v.outputs.version }}"
            git push origin main
          fi
