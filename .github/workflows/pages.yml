name: Deploy website

# The website lives in web/. A push to main that touches it (or a manual run, or the weekly update) checks the
# links and publishes the folder to GitHub Pages. See web/README.md.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  # (A new or edited release also refreshes web/latest.json: release-refresh.yml asks main to run this workflow, because
  # GitHub Pages only accepts deployments that run from main, and a `release` event runs from the release's tag.)
  # The Windows build publishes its release with the workflow's own token, which does not raise `release` events.
  workflow_run:
    workflows: ['Windows build']
    types: [completed]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Refresh latest.json from the newest releases (what the apps' update checks read)
        run: node scripts/update-latest-json.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Quality gate (links, secrets, scripts, browser tests); a broken site is never published"
        run: bash scripts/gate-site.sh
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Leave out files that are not part of the site
        run: rm -rf web/node_modules web/tests web/test-results web/playwright* web/package*.json web/*.md
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
