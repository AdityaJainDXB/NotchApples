# Builds the Windows installers for Notch apple (NotchWindows/, Tauri).
#
# A Windows build cannot be cross-compiled from macOS, so this runs on a real
# Windows runner. Push a tag like `win-v1.13.5` to attach the installers to a
# GitHub release (and refresh the one-click
# `windows-latest` download), or run it by hand from the Actions tab to just get artifacts.

name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['win-v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NotchWindows/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: NotchWindows/src-tauri
          # Tagged releases only read the cache. Saving a new ~600 MB copy on every release filled the 10 GB limit.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        run: cargo tauri build

      - name: Show what was produced
        shell: bash
        run: ls -R target/release/bundle || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: notch-apple-windows
          path: |
            NotchWindows/src-tauri/target/release/bundle/nsis/*.exe
            NotchWindows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Fixed, version-free filenames so the README can link straight to a
      # one-click download that never changes.
      - name: Give the installers stable names
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: bash
        run: |
          cp target/release/bundle/nsis/*.exe target/release/bundle/NotchApple-Windows-Setup.exe
          cp target/release/bundle/msi/*.msi target/release/bundle/NotchApple-Windows.msi

      - name: Attach to the versioned release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          # Never become the repo's "latest" release: the Mac app looks for a
          # release with a .dmg, and a Windows one has none for it to install.
          make_latest: false
          name: "Notch apple for Windows ${{ github.ref_name }}"
          files: |
            NotchWindows/src-tauri/target/release/bundle/nsis/*.exe
            NotchWindows/src-tauri/target/release/bundle/msi/*.msi

      # The README's "Download for Windows" button points at this release:
      # .../releases/download/windows-latest/NotchApple-Windows-Setup.exe
      # Its tag (windows-latest) does not match `win-v*`, so it can't re-trigger
      # this workflow. Assets with the same name are replaced each time.
      - name: Update the one-click "windows-latest" download
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          make_latest: false
          name: "Notch apple for Windows (always the newest)"
          body: |
            **Windows download.** Get `NotchApple-Windows-Setup.exe` below, double-click it, and follow the steps in the [README](https://github.com/${{ github.repository }}#download).

            This page always holds the newest Windows build (currently **${{ github.ref_name }}**). The Mac app is on the [main releases page](https://github.com/${{ github.repository }}/releases/latest).
          files: |
            NotchWindows/src-tauri/target/release/bundle/NotchApple-Windows-Setup.exe
            NotchWindows/src-tauri/target/release/bundle/NotchApple-Windows.msi
