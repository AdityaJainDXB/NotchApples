labels: ["question"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Mac or Windows?
      options: [Mac, Windows, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (if you know it)
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
